name: Einmalige Uebernahme
on: workflow_dispatch
permissions:
  contents: write
jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dateien holen und Groessen pruefen
        run: |
          fehler=0
          while read -r pfad groesse; do
            [ -z "$pfad" ] && continue
            mkdir -p "$(dirname "$pfad")"
            curl -sSfL "https://www.eq-collective.de/$pfad" -o "$pfad" || { echo "FEHLT $pfad"; fehler=1; continue; }
            case "$pfad" in *.html) perl -0pi -e 's#<script[^>]*site-script\.js[^>]*></script>##g' "$pfad";; esac
            ist=$(wc -c < "$pfad")
            if [ "$ist" != "$groesse" ]; then echo "ABWEICHUNG $pfad soll $groesse ist $ist"; fehler=1; fi
          done < import-liste.txt
          echo "Fehler: $fehler"
          exit $fehler
      - name: Festschreiben
        run: |
          touch .nojekyll
          git config user.name "eq-website-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Uebernahme der Website von der Light-Seite"
          git push

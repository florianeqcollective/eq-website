name: tmp-runway2
on:
  push:
    paths: ['.github/workflows/tmp-runway2.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/p.py
          echo 'H4sICMyvBmsCA25ld3Q0Yi5qcwBdjzEOwjAQBHtecUpjUIjS0GEsQUNHgfjAhVySE86Bzg4G3sNP+BgBiYZimxlpV3tFhbhYGVvzFY4eQ1hlLEXzKGLmLP+hke0HSXi3JTtb/azJNe2ozU3mTN7QVNPhFme5sWXlbLiguA0H6Ji0YwElPnYRagywJV/PIZEIoPcEpAk1UiSB9dBEfT1bAqxaQq2IRwGBpYZhjHxKAuxooACnc99HW36nbDlecWY5eQPEMmiI2wAAAA==' | base64 -d | gunzip > /tmp/newt4b.js
          python3 /tmp/p.py
          node --check assets/intern/secFZ.js
          node --test tests/static.test.cjs
      - name: commit
        run: |
          git config user.name eq-website-bot
          git config user.email bot@eq-collective.de
          git add assets intern.html
          git commit -m "Finanzkennzahlen: Runway-Kachel mit weniger Kleingedrucktem"
          git pull --rebase origin main
          git push origin HEAD:main

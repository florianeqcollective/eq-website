name: tmp-zahlen
on:
  push:
    paths: ['.github/workflows/tmp-zahlen.yml']
permissions:
  contents: write
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: patch
        run: |
          echo '' | base64 -d | gunzip > /tmp/p.py
          python3 /tmp/p.py
          node --check assets/intern/secV.js
          node --check assets/intern.js
          node --test tests/static.test.cjs
      - name: commit
        run: |
          git config user.name eq-website-bot
          git config user.email bot@eq-collective.de
          git add assets intern.html
          git commit -m "Vertriebskennzahlen: Schalter Insgesamt und letzte 30 Tage"
          git pull --rebase origin main
          git push origin HEAD:main

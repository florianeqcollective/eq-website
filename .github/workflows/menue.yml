name: Menue Blog und Newsletter
on: workflow_dispatch
permissions:
  contents: write
jobs:
  menue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Menue umbauen
        run: |
          perl -0pi -e 's#<a href="ressourcen.html">Blog und Newsletter</a>#<a href="ressourcen.html">Blog</a><a href="newsletter.html">Newsletter</a>#g' *.html
          perl -0pi -e 's#<a href="ressourcen.html" class="on">Blog und Newsletter</a>#<a href="ressourcen.html" class="on">Blog</a><a href="newsletter.html">Newsletter</a>#g' ressourcen.html
          perl -0pi -e 's#<a href="ressourcen.html" class="on">Blog und Newsletter</a>#<a href="ressourcen.html">Blog</a><a href="newsletter.html" class="on">Newsletter</a>#g' newsletter.html
          perl -0pi -e "s#\['ressourcen.html','Blog und Newsletter'\]#['ressourcen.html','Blog'],['newsletter.html','Newsletter']#" assets/site.js
          perl -0pi -e "s#P\['newsletter'\]\.nav='ressourcen\.html';#P['newsletter'].nav='newsletter.html';#" assets/pages.js
          git diff --stat
          test "$(grep -l 'Blog und Newsletter</a>' *.html | wc -l)" = "0"
          grep -c "'newsletter.html','Newsletter'" assets/site.js
          grep -c "P\['newsletter'\].nav='newsletter.html'" assets/pages.js
          git config user.name "florianeqcollective"
          git config user.email "florian@eq-collective.de"
          git commit -am "Menue: Blog und Newsletter als eigene Punkte"
          git push

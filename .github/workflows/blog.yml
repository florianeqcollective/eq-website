name: blog-bereinigen
on:
  push:
    paths:
      - '.github/workflows/blog.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Blog-Seite bereinigen
        run: |
          python3 - <<'PY'
          import re
          p='ressourcen.html'
          s=open(p,encoding='utf-8').read()
          a=s.index('<span id="newsletter"></span>')
          b=s.index('<section class="sec"><div class="wrap"><h2>Selbst hinschauen')
          s=s[:a]+'<section class="sec alt"><div class="wrap"><h2>Selbst hinschauen'+s[b+len('<section class="sec"><div class="wrap"><h2>Selbst hinschauen'):]
          s=s.replace('Blog und Newsletter von EQ Collective zu','Der Blog von EQ Collective zu')
          s=s.replace('Blog und Newsletter | EQ Collective','Blog | EQ Collective')
          s=s.replace('<h1>Blog und Newsletter</h1>','<h1>Blog</h1>')
          s=s.replace('href="#newsletter">Newsletter abonnieren','href="newsletter.html">Newsletter abonnieren')
          assert 'Blog und Newsletter' not in s and 'id="newsletter"' not in s
          open(p,'w',encoding='utf-8').write(s)
          q='assets/pages.js'
          t=open(q,encoding='utf-8').read()
          t=t.replace("l:'Blog, Newsletter und Teamcheck an einem Ort. Sucht nach einem Thema oder stöbert nach Schlagworten.'","l:'Ideen für bessere Zusammenarbeit, direkt aus unserer Praxis. Sucht nach einem Thema oder stöbert nach Schlagworten.'")
          t=t.replace("lnk('Newsletter abonnieren','#newsletter')","lnk('Newsletter abonnieren','newsletter.html')")
          t=t.replace("P['ressourcen']={title:'Ressourcen'","P['ressourcen']={title:'Blog'")
          t=t.replace("h:'Lesen, lernen, selbst prüfen'","h:'Blog'")
          i=t.index("'<span id=\"newsletter\"></span>'+sec({h:'Newsletter'")
          j=t.index("sec({c:'alt',h:'Selbst hinschauen'",i)
          t=t[:i]+t[j:]
          open(q,'w',encoding='utf-8').write(t)
          PY
          git config user.name "eq-bot"
          git config user.email "bot@eq-collective.de"
          git add -A
          git commit -m "Blog-Seite von Newsletter-Inhalten befreit, Texte angepasst"
          git push
